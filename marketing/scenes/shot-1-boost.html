<body>

  </div>
  <div class="win" id="win" style="left: 560px; top: 56px; width: 660px; height: 700px;"></div>
  <iframe class="popup-frame" id="pop" style="right: 82px; top: 138px; transform: scale(1.18);"></iframe>
  <script src="kit.js"></script>
  <script>
    document.getElementById('win').innerHTML = Kit.browser({ badge: '250' });
    window.sceneReady = Kit.popup(document.getElementById('pop')).then(p => p.set({ pct: 250, level: 0.72, t: 1.3 }));
