<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="render" content="1280x800 out/store/screenshot-5-privacy.png" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/hifi.css" />
  <link rel="stylesheet" href="kit.css" />
  <style>
    body { width: 1280px; height: 800px; }
    .facts { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; font-size: 19px; }
    .facts div { display: flex; gap: 12px; align-items: baseline; }
    .facts div::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--led); box-shadow: 0 0 8px var(--led); flex: none; transform: translateY(-2px); }
    .dev { position: absolute; right: 120px; top: 50%; transform: translateY(-50%) scale(2.2); transform-origin: right center; }
    .dev .knobwrap { margin: 0; height: 220px; }
  </style>
</head>
<body>
  <div class="copy" style="width: 560px">
    <p class="eyebrow">Private by design</p>
    <h1>Nothing leaves your <em>computer</em>.</h1>
    <div class="facts">
      <div>All sound processing happens on your device</div>
      <div>No account, no ads, no analytics</div>
      <div>Works only on the tab you choose</div>
      <div>Open source on GitHub</div>
    </div>
  </div>
  <div class="dev">
    <div class="knobwrap"><svg viewBox="0 0 220 220" id="ring"></svg><div class="knob" id="knob"><div class="grip" id="grip"></div></div></div>
  </div>
  <script src="/shared/hifi.js"></script>
  <script>
    mountKnob({ ring: document.getElementById('ring'), knob: document.getElementById('knob'), grip: document.getElementById('grip'), onInput() {} }).render(420);
    window.sceneReady = Promise.resolve();
  </script>
</body>
</html>
